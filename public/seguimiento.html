<style>
:root{
  --ground:#F2EFEA; --surface:#FFFFFF; --surface-2:#E9E5DF; --line:#DCD8D1; --ink:#1B1B1A; --muted:#67635D;
  --magma:#D9481C; --magma-text:#B83A12; --magma-soft:#FBE4DA; --ok:#1F8B4C; --ok-soft:#E3F2E9; --bad:#B3261E;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(27,27,26,.05),0 12px 32px rgba(27,27,26,.08); color-scheme:light;
}
@media all{:root:not([data-theme="light"]){
  --ground:#121211; --surface:#1B1B1A; --surface-2:#252523; --line:#35342F; --ink:#F2EFEA; --muted:#A9A49B;
  --magma:#E5562A; --magma-text:#FF8A5E; --magma-soft:#3A1D12; --ok:#3DBF76; --ok-soft:#14291D; --bad:#F2918A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#121211; --surface:#1B1B1A; --surface-2:#252523; --line:#35342F; --ink:#F2EFEA; --muted:#A9A49B;
  --magma:#E5562A; --magma-text:#FF8A5E; --magma-soft:#3A1D12; --ok:#3DBF76; --ok-soft:#14291D; --bad:#F2918A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
header{background:#1B1B1A;color:#F2EFEA;border-bottom:6px solid #D9481C;padding-top:env(safe-area-inset-top,0)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:66px}
header svg{height:38px;width:auto;display:block;color:#F2EFEA;--logo-inv:#1B1B1A}
header .tag{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:rgba(242,239,234,.6);text-align:right}
h1,h2,h3{font-family:var(--display);font-stretch:78%;font-weight:800;line-height:1;margin:0;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-top:16px}
.hero{background:#1B1B1A;color:#F2EFEA;border:0;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 90% at 100% 110%,rgba(217,72,28,.55),transparent 60%),radial-gradient(50% 60% at 0% 0%,rgba(220,216,209,.08),transparent 70%)}
.hola{font-size:15px;color:rgba(242,239,234,.72)}
.coche{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.05;margin-top:4px;text-transform:uppercase}
.mat{display:inline-block;margin-top:8px;font:700 13px/1 var(--body);letter-spacing:.1em;background:#F2EFEA;color:#1B1B1A;border-left:8px solid #2F55A4;padding:6px 10px;border-radius:4px}
.estado-now{display:flex;gap:14px;align-items:center;margin-top:20px;padding:16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.estado-now .ic{flex-shrink:0;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#D9481C;color:#fff}
.estado-now.listo .ic{background:#1F8B4C}
.estado-now b{display:block;font-family:var(--display);font-stretch:82%;font-size:22px;text-transform:uppercase;line-height:1.05}
.estado-now span{font-size:14.5px;color:rgba(242,239,234,.75)}
.entrega{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px;color:rgba(242,239,234,.85)}
.entrega b{color:#fff}
.sec-t{font-size:22px;margin-bottom:14px}
/* línea de tiempo */
.pasos{list-style:none;margin:0;padding:0;position:relative}
.pasos li{position:relative;padding:0 0 22px 44px;min-height:30px}
.pasos li:last-child{padding-bottom:0}
.pasos li::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.pasos li:last-child::before{display:none}
.pasos li.hecho::before{background:var(--magma)}
.pasos .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid var(--line)}
.pasos li.hecho .dot{background:var(--magma);border-color:var(--magma);color:#fff}
.pasos li.actual .dot{background:var(--surface);border-color:var(--magma);color:var(--magma);box-shadow:0 0 0 6px color-mix(in srgb,var(--magma) 18%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--magma) 6%,transparent)}}
@media (prefers-reduced-motion:reduce){.pasos li.actual .dot{animation:none}}
.pasos b{display:block;font-size:16px;line-height:1.3}
.pasos li.pend b{color:var(--muted);font-weight:600}
.pasos small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pasos .nota{margin-top:6px;font-size:14.5px;background:var(--surface-2);border-radius:10px;padding:8px 12px}
/* presupuesto */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--line)}
td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
tfoot td{border:0;padding:6px 0}
tfoot tr.total td{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:26px;padding-top:12px}
.p-estado{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--magma-soft);color:var(--magma-text)}
.p-estado.ok{background:var(--ok-soft);color:var(--ok)}
.p-estado.no{background:var(--surface-2);color:var(--muted)}
.p-nota{margin:14px 0 0;color:var(--muted);font-size:14.5px;white-space:pre-line}
.resp{display:grid;gap:12px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.in{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.in:focus{outline:none;border-color:var(--magma);box-shadow:0 0 0 4px color-mix(in srgb,var(--magma) 16%,transparent)}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
label.chk input{width:20px;height:20px;accent-color:var(--magma);flex-shrink:0;margin-top:1px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:wait}
.b-magma{background:var(--magma);color:#fff;flex:1 1 220px}
.b-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.b-wa{background:#1F8B4C;color:#fff;flex:1 1 180px}
.b-ink{background:var(--ink);color:var(--ground);flex:1 1 140px}
.err{color:var(--bad);font-weight:600;font-size:14.5px}
/* fotos */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fotos button{padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--surface-2);aspect-ratio:4/3;position:relative}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12.5px;font-weight:600;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65))}
dialog{border:0;padding:0;background:transparent;max-width:min(960px,96vw);max-height:92dvh}
dialog::backdrop{background:rgba(10,10,10,.85)}
dialog img{max-width:100%;max-height:84dvh;display:block;border-radius:12px}
dialog p{color:#fff;margin:10px 0 0;text-align:center}
dialog button{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.msg{white-space:pre-line}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:26px 0 40px}
.skel{height:220px;border-radius:22px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;margin-top:16px}
@keyframes sk{to{background-position:-200% 0}}
.vacio{text-align:center;padding:40px 20px}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOKEN=(location.pathname.match(/\/s\/([A-Za-z0-9]{16})/)||[])[1]||new URLSearchParams(location.search).get("t")||"";
const TEL="+34643668813", WA="34643668813";
let D=null, EN=false;
const L=(es,en)=>EN?en:es;
const eur=n=>Number(n||0).toLocaleString(EN?"en-GB":"es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fechaL=f=>{ if(!f) return ""; const t=new Date(f+"T12:00:00Z").toLocaleDateString(EN?"en-GB":"es-ES",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}); return t[0].toUpperCase()+t.slice(1); };
const cuando=iso=>new Date(iso).toLocaleString(EN?"en-GB":"es-ES",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Atlantic/Canary"});
const IC={
  recibido:'<path d="M5 16h14M3.5 16v-3.2c0-.6.2-1.1.6-1.5L6.8 8.5c.4-.3.9-.5 1.4-.5h7.3c.6 0 1.1.2 1.5.6l2.6 2.7c.4.4.9.6 1.4.7l.5.1c.3.1.5.4.5.7V16M7.5 18.5a2 2 0 100-4 2 2 0 000 4zM16.5 18.5a2 2 0 100-4 2 2 0 000 4z"/>',
  diagnostico:'<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 12h2l1.5-3 2 6 1.5-3h1"/>',
  presupuesto:'<path d="M6 3h9l4 4v14H6zM9 12h6M9 16h4M14 3v4h4"/>',
  reparacion:'<path d="M14.7 6.3a4 4 0 00-5.4 5.2L3.5 17.3a1.8 1.8 0 002.5 2.5l5.8-5.8a4 4 0 005.2-5.4l-2.5 2.5-2.1-.4-.4-2.1 2.7-2.3z"/>',
  calidad:'<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3zM9 12l2 2 4-4"/>',
  listo:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  entregado:'<path d="M4 11l8-6.5 8 6.5V20h-5v-5H9v5H4z"/>'
};
const svg=k=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||IC.recibido}</svg>`;
const PASOS=["recibido","diagnostico","presupuesto","reparacion","calidad","listo","entregado"];
const TXT=()=>({
  recibido:[L("Coche recibido","Car received"),L("Tu coche ya está en nuestro taller.","Your car is at our workshop.")],
  diagnostico:[L("Diagnóstico","Inspection"),L("Estamos revisando el coche para saber qué necesita.","We're checking the car to see what it needs.")],
  presupuesto:[L("Presupuesto","Quote"),L("Te hemos preparado el presupuesto. No tocamos nada sin tu aprobación.","Your quote is ready. We won't touch anything without your approval.")],
  reparacion:[L("En reparación","Being repaired"),L("Estamos trabajando en tu coche.","We're working on your car.")],
  calidad:[L("Control de calidad","Quality check"),L("Otra persona del taller revisa el trabajo y prueba el coche.","A second person checks the work and road-tests the car.")],
  listo:[L("Listo para recoger","Ready for collection"),L("¡Ya puedes venir a por él! Lunes a viernes, de 8:00 a 16:00.","You can pick it up! Monday to Friday, 8:00 to 16:00.")],
  entregado:[L("Entregado","Handed over"),L("Gracias por confiar en Volcano Cars.","Thank you for trusting Volcano Cars.")]
});

async function cargar(silencioso){
  if(!TOKEN){ pintarError(); return; }
  try{
    const r=await fetch("/api/seguimiento/"+TOKEN,{cache:"no-store"});
    if(!r.ok) throw 0;
    const d=await r.json();
    const cambio=JSON.stringify(d)!==JSON.stringify(D);
    D=d; EN=d.idioma==="en"; document.documentElement.lang=EN?"en":"es";
    if(cambio){ const foco=document.activeElement; if(!(silencioso && foco && foco.closest && foco.closest(".resp"))) pintar(); }
  }catch(_){ if(!D) pintarError(); }
}
function pintarError(){
  $("#app").innerHTML=`<div class="card vacio"><h2 class="sec-t">${L("Enlace no válido","Invalid link")}</h2><p style="color:var(--muted)">${L("Revisa que el enlace esté completo o escríbenos y te lo reenviamos.","Please check the link is complete, or message us and we'll resend it.")}</p><div class="btns" style="justify-content:center;margin-top:16px"><a class="btn b-wa" href="https://wa.me/${WA}">WhatsApp</a></div></div>`;
}
function pintar(){
  const d=D, T=TXT();
  document.title=L("Seguimiento de tu coche","Your car's progress")+" · Volcano Cars";
  $("#t-tag").innerHTML=L("Seguimiento<br>de tu coche","Your car's<br>progress");
  const idx=PASOS.indexOf(d.estado);
  const hechos={}; (d.pasos||[]).forEach(p=>{ if(PASOS.includes(p.estado)) hechos[p.estado]=p; });
  const aprob=d.presupuesto&&d.presupuesto.estado==="aceptado";
  const est=T[d.estado]||T.recibido;
  let estTxt=est[1];
  if(d.estado==="presupuesto" && aprob) estTxt=L("Has aprobado el presupuesto. Empezamos enseguida.","You've approved the quote. We'll start shortly.");
  const wtxt=encodeURIComponent(L(`Hola, os escribo por mi coche ${d.vehiculo.coche||""} ${d.vehiculo.matricula||""}. `,`Hi, I'm writing about my car ${d.vehiculo.coche||""} ${d.vehiculo.matricula||""}. `));
  let h=`<section class="card hero">
    <div class="hola">${L("Hola","Hi")} ${esc(d.nombre)}</div>
    <div class="coche">${esc(d.vehiculo.coche||L("Tu coche","Your car"))}</div>
    ${d.vehiculo.matricula?`<span class="mat">${esc(d.vehiculo.matricula.toUpperCase())}</span>`:""}
    <div class="estado-now ${d.estado==="listo"||d.estado==="entregado"?"listo":""}"><span class="ic">${svg(d.estado)}</span><div><b>${esc(est[0])}</b><span>${esc(estTxt)}</span></div></div>
    ${d.entrega&&idx<5?`<div class="entrega"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><span>${L("Entrega prevista:","Expected ready:")} <b>${esc(fechaL(d.entrega))}</b></span></div>`:""}
  </section>`;
  // presupuesto
  const p=d.presupuesto;
  if(p){
    const est2=p.estado==="aceptado"?`<span class="p-estado ok">✓ ${L("Aprobado","Approved")}${p.respuesta?" · "+esc(cuando(p.respuesta.t)):""}</span>`:p.estado==="rechazado"?`<span class="p-estado no">${L("No aprobado","Declined")}</span>`:`<span class="p-estado">${L("Pendiente de tu aprobación","Waiting for your approval")}</span>`;
    h+=`<section class="card" id="presu"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px"><h2 class="sec-t" style="margin:0">${L("Presupuesto","Quote")}</h2>${est2}</div>
      <table><thead><tr><th>${L("Concepto","Item")}</th><th class="n">${L("Cant.","Qty")}</th><th class="n">${L("Importe","Amount")}</th></tr></thead><tbody>
      ${p.lineas.map(l=>`<tr><td>${esc(l.c)}</td><td class="n">${String(l.n).replace(".",EN?".":",")}</td><td class="n">${eur(l.n*l.p)}</td></tr>`).join("")}
      </tbody><tfoot><tr><td colspan="2">${L("Base imponible","Subtotal")}</td><td class="n">${eur(p.base)}</td></tr><tr><td colspan="2">IGIC ${String(p.igic).replace(".",",")} %</td><td class="n">${eur(p.igicImporte)}</td></tr><tr class="total"><td colspan="2">${L("Total","Total")}</td><td class="n">${eur(p.total)}</td></tr></tfoot></table>
      ${p.nota?`<p class="p-nota">${esc(p.nota)}</p>`:""}
      ${p.validez&&p.estado==="enviado"?`<p class="p-nota">${L("Válido hasta el","Valid until")} ${esc(fechaL(p.validez).toLowerCase())}.</p>`:""}
      ${p.estado==="enviado"?`<form class="resp" id="resp" novalidate>
        <b style="font-size:17px">${L("¿Damos luz verde?","Shall we go ahead?")}</b>
        <input class="in" id="r-nombre" autocomplete="name" placeholder="${L("Tu nombre y apellidos","Your full name")}" required>
        <textarea class="in" id="r-com" rows="2" placeholder="${L("Comentario (opcional)","Comment (optional)")}"></textarea>
        <label class="chk"><input type="checkbox" id="r-ok"><span>${L("He leído el presupuesto y autorizo a Volcano Cars a hacer estos trabajos por el importe indicado.","I have read the quote and authorise Volcano Cars to carry out this work for the amount shown.")}</span></label>
        <div class="err" id="r-err" role="alert" hidden></div>
        <div class="btns"><button class="btn b-magma" type="submit" data-acc="aceptar">${L("Aceptar presupuesto","Accept quote")}</button><button class="btn b-ghost" type="button" data-acc="rechazar">${L("No, gracias","No, thanks")}</button></div>
      </form>`:""}
    </section>`;
  }
  // línea de tiempo
  h+=`<section class="card"><h2 class="sec-t">${L("Cómo va","Progress")}</h2><ol class="pasos">`+PASOS.map((k,i)=>{
    const cls=i<idx?"hecho":i===idx?(k==="entregado"?"hecho":"actual"):"pend";
    const p0=hechos[k];
    return `<li class="${cls}"><span class="dot">${i<idx||k==="entregado"&&i===idx?svg("listo"):svg(k)}</span><b>${esc(T[k][0])}</b>${p0&&i<=idx?`<small>${esc(cuando(p0.t))}</small>`:""}${p0&&p0.nota&&i<=idx?`<div class="nota">${esc(p0.nota)}</div>`:""}</li>`;
  }).join("")+`</ol></section>`;
  if(d.mensaje) h+=`<section class="card"><h2 class="sec-t">${L("Mensaje del taller","Message from the workshop")}</h2><p class="msg" style="margin:0">${esc(d.mensaje)}</p></section>`;
  if(d.fotos&&d.fotos.length) h+=`<section class="card"><h2 class="sec-t">${L("Fotos de tu coche","Photos of your car")}</h2><div class="fotos">${d.fotos.map((f,i)=>`<button type="button" data-f="${i}"><img src="/api/fotos/${encodeURIComponent(f.k)}" alt="${esc(f.txt)}" loading="lazy">${f.txt?`<span>${esc(f.txt)}</span>`:""}</button>`).join("")}</div></section>`;
  h+=`<section class="card"><h2 class="sec-t">${L("¿Alguna duda?","Any questions?")}</h2><div class="btns"><a class="btn b-wa" href="https://wa.me/${WA}?text=${wtxt}" target="_blank" rel="noopener">WhatsApp</a><a class="btn b-ink" href="tel:${TEL}">${L("Llamar","Call")}</a></div></section>
  <p class="foot">Volcano Cars · Calle Valle Largo, Nave 8, Antigua · ${L("Esta página se actualiza sola.","This page updates automatically.")}<br>${L("Última actualización","Last update")}: ${esc(cuando(d.actualizado))}</p>`;
  $("#app").innerHTML=h;
}
document.addEventListener("click",async e=>{
  const f=e.target.closest("[data-f]");
  if(f){ const x=D.fotos[+f.dataset.f]; $("#lb-img").src="/api/fotos/"+encodeURIComponent(x.k); $("#lb-t").textContent=x.txt||""; $("#lb").showModal(); return; }
  const b=e.target.closest("[data-acc]"); if(!b) return;
  e.preventDefault();
  const acc=b.dataset.acc, err=$("#r-err"); err.hidden=true;
  const nombre=$("#r-nombre").value.trim();
  if(acc==="aceptar" && (nombre.length<2 || !$("#r-ok").checked)){ err.textContent=L("Escribe tu nombre y marca la casilla para aceptar.","Please enter your name and tick the box to accept."); err.hidden=false; return; }
  if(acc==="rechazar" && !confirm(L("¿Seguro que no quieres hacer la reparación? Te llamaremos para comentarlo.","Are you sure you don't want the repair? We'll call you to talk it through."))) return;
  document.querySelectorAll("[data-acc]").forEach(x=>x.disabled=true);
  try{
    const r=await fetch("/api/seguimiento/"+TOKEN+"/respuesta",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({accion:acc,nombre,comentario:$("#r-com").value,acepta:$("#r-ok").checked})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||"Error");
    D=j; pintar(); document.getElementById("presu").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(x){ err.textContent=x.message||L("No se ha podido enviar. Inténtalo otra vez o escríbenos.","Couldn't send it. Try again or message us."); err.hidden=false; document.querySelectorAll("[data-acc]").forEach(y=>y.disabled=false); }
});
$("#resp")?.addEventListener("submit",e=>e.preventDefault());
document.addEventListener("submit",e=>{ if(e.target.id==="resp"){ e.preventDefault(); e.target.querySelector('[data-acc="aceptar"]').click(); } });
$("#lb-x").onclick=()=>$("#lb").close();
$("#lb").addEventListener("click",e=>{ if(e.target.id==="lb") $("#lb").close(); });
cargar();
setInterval(()=>{ if(!document.hidden) cargar(true); },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) cargar(true); });
</script>
</body>
</html>
