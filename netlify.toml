[build]
  # 1.º comprueba que ninguna función se quedaría sin dirección (tools/comprobar-funciones.mjs, act. 73): si falla, NO se publica
  #     y sigue en línea la versión anterior. 2.º descarga las fuentes a /fonts (tools/fuentes-locales.mjs) y minifica la copia publicada.
  command = "node tools/comprobar-funciones.mjs && { node tools/fuentes-locales.mjs; node tools/minificar-html.mjs; }"
  publish = "public"
  functions = "netlify/functions"

# Manuales internos (netlify/privado): los entrega /api/manual/… solo con sesión del panel.
# Act. 73: los PDF (8 MB) van SOLO dentro de la función «manuales». Antes iban dentro de las 55 funciones
# (cada una pesaba 7,5 MB en vez de ~0,1 MB): arrancaban más despacio y cada publicación subía ~390 MB.
[functions.manuales]
  included_files = ["netlify/privado/**"]

# La dirección antigua de Netlify manda a la definitiva (una sola web para Google)
[[redirects]]
  from = "https://lestter7th.netlify.app/*"
  to = "https://volcanocars.com/:splat"
  status = 301
  force = true

# Una sola versión del dominio (checklist de lanzamiento, 27-09-2026): www y http → https://volcanocars.com
[[redirects]]
  from = "https://www.volcanocars.com/*"
  to = "https://volcanocars.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.volcanocars.com/*"
  to = "https://volcanocars.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://volcanocars.com/*"
  to = "https://volcanocars.com/:splat"
  status = 301
  force = true

# Direcciones antiguas con .html → dirección limpia (301)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Secciones de la web con dirección propia (se generan con tools/build-en.py)
[[redirects]]
  from = "/comprar"
  to = "/comprar/index.html"
  status = 200

[[redirects]]
  from = "/taller"
  to = "/taller/index.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/contacto/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200


[[redirects]]
  from = "/aviso-legal"
  to = "/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[redirects]]
  from = "/condiciones"
  to = "/condiciones.html"
  status = 200

# =====================================================================
# MURO DE SEGURIDAD: cabeceras para toda la web
#  - HSTS: siempre HTTPS (incluso si alguien escribe http://)
#  - CSP: el navegador solo carga código, estilos e imágenes de esta web y de Google (fuentes, mapa,
#    anuncios). Aunque alguien consiguiera colar código, no podría mandar datos a otra web.
#  - Nadie puede meter la web dentro de otra página (clickjacking) ni hacer pasar un archivo por otro.
# =====================================================================
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google.com https://www.google.es https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://*.gstatic.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://www.google.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://www.google.com https://maps.google.com https://www.googletagmanager.com https://td.doubleclick.net https://bid.g.doubleclick.net; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"

# Panel: todavía más estricto (solo habla con su propio servidor) y fuera de Google.
# Act. 73 · Cache-Control «no-cache» (antes «no-store»): el navegador guarda la página del panel (360 KB comprimida; no lleva datos,
# los datos llegan aparte con la sesión) pero SIEMPRE pregunta al servidor si ha cambiado antes de usarla. Si no ha cambiado no la
# vuelve a descargar (abre mucho más rápido, sobre todo en el móvil); si se ha publicado una versión nueva, baja la nueva. Nunca sale una vieja.
[[headers]]
  for = "/admin"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), bluetooth=(), serial=(), hid=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; worker-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), bluetooth=(), serial=(), hid=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; worker-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# Enlace privado de seguimiento: que no se filtre a otras webs ni lo guarde Google
[[headers]]
  for = "/s/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

[[headers]]
  for = "/seguimiento.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

# Reserva online: enlace privado de cada cliente (/r/XXXXXXXXXXXXXXXXXXXXXXXX). Fuera de Google y sin filtrar el enlace.
[[headers]]
  for = "/r/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

[[headers]]
  for = "/reserva.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/r/*"
  to = "/reserva.html"
  status = 200

# Seguimiento de la reparación: enlace corto que se manda al cliente (/s/XXXXXXXXXXXXXXXX)
[[redirects]]
  from = "/s/*"
  to = "/seguimiento.html"
  status = 200


# Vídeos de la ayuda del panel: no se indexan. Cada vídeo se pide con ?v=<huella de su contenido> (lo pone tools/ayuda/videos.py),
# así que si se regraba, su dirección cambia y el navegador nunca sirve uno viejo: por eso la caché puede ser larga.
[[headers]]
  for = "/ayuda/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=31536000, immutable"

# Caché (checklist de lanzamiento, 27-09-2026): fuentes, logos y fotos fijas de los coches se guardan en el
# navegador; las páginas y los scripts siguen revalidándose en cada visita (Netlify usa ETag).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/coches/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"


# Vídeos de fondo del taller (public/vfx): llevan ?v= en la dirección, así que se pueden guardar 30 días
[[headers]]
  for = "/vfx/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=2592000"

# Página de gracias (public/gracias): vídeo y fotos del volcán hechos con Remotion, se piden con ?v=
[[headers]]
  for = "/gracias/volcan*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Manuales de sistemas (public/sistemas): documentos internos del equipo, fuera de Google. Llevan ?v= en el enlace.
[[headers]]
  for = "/sistemas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=86400"
